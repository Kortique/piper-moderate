  tr.row-checked td { background: #1a2a1a; }

  .age-cell { white-space: nowrap; }

  .age-child .age-bar { background: #e09a52; }
  .age-teen  .age-bar { background: #d5c23a; }
  .age-adult .age-bar { background: #4caf50; }
  .age-old   .age-bar { background: #888; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-right: 4px; }
  .badge-child  { background: #5c1a1a; color: #ff8080; }
  .badge-forced { background: #3a1a5c; color: #d080ff; }
  .badge-teen   { background: #4a3a00; color: #ffd040; }
  .badge-adult  { background: #0f2e10; color: #6fda72; }
  a { text-decoration: none; }
  a:hover { text-decoration: underline; }
  a.ls-link  { color: #c792ea; }
  a.img-link { color: #5aafff; cursor: pointer; }
  a.img-link:hover { color: #88ccff; }
  .url-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #table-wrap { overflow-y: auto; max-height: calc(100vh - 110px); }
  input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #4caf50; }
  #tip {
    position: fixed; display: none; z-index: 9999; pointer-events: none;
    background: #111; border: 1px solid #555; border-radius: 6px; padding: 4px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.85);
  }
  #tip .tip-label { font-size: 11px; color: #666; padding: 2px 4px 4px; max-width: 316px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

const LS_BASE = 'https://ls.artworks.ai';
const STORAGE_KEY = 'qwen3_checked_ids';

// ── Checkbox state ───────────────────────────────────────────────────
let checked = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

// Pre-check forced children if not yet touched
const FORCED = new Set(RAW.filter(r => r.forced).map(r => r.id));
FORCED.forEach(id => checked.add(id));
saveChecked();

function saveChecked() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...checked]));
}

function toggleCheck(id, val) {
  if (val) checked.add(id); else checked.delete(id);
  saveChecked();
  // update row style
  const row = document.getElementById('row-' + id);
  if (row) row.className = val ? 'row-checked' : '';
  updateCount();
}

function exportChecked() {
  const ids = [...checked].sort((a,b) => a-b);
  const lines = ids.map(id => {
    const r = RAW.find(x => x.id === id);
    return r ? id + '\t' + r.from + '-' + r.to + '\t' + r.url : id;
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'checked_children.txt';
  a.click();
}

// ── Preview ──────────────────────────────────────────────────────────
let hoverTimer = null;
let activeUrl  = null;
const tip      = document.getElementById('tip');
const tipLabel = document.getElementById('tip-label');
const tipFrame = document.getElementById('tip-frame');

function positionTip(mx, my) {
  const pw = 336, ph = 360;
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = mx + 22, y = my - 40;
  if (x + pw > vw - 8) x = mx - pw - 14;
  if (y + ph > vh - 8) y = vh - ph - 8;
  if (y < 8) y = 8;
  tip.style.left = x + 'px';
  tip.style.top  = y + 'px';
}
function showTip(url, label, mx, my) {
  if (activeUrl === url) return;
  activeUrl = url;
  tipLabel.textContent = label;
  tipFrame.srcdoc = '<html><body style="margin:0;padding:0;background:#111;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden">'
    + '<img src="' + url + '" style="max-width:320px;max-height:320px;width:auto;height:auto;object-fit:contain;display:block">'
    + '</body></html>';
  positionTip(mx, my);
  tip.style.display = 'block';
}
function hideTip() {
  clearTimeout(hoverTimer);
  tip.style.display = 'none';
  tipFrame.srcdoc = '';
  activeUrl = null;
}
document.addEventListener('mousemove', e => {
  if (tip.style.display === 'block') positionTip(e.clientX, e.clientY);
});

// ── Table ────────────────────────────────────────────────────────────
function isChild(r)  { return r.forced || r.from <= 14; }
function isTeen(r)   { return !r.forced && r.from >= 15 && r.from <= 17; }
function isAdult(r)  { return !r.forced && r.from >= 18; }

function badge(r) {
  if (r.forced) return '<span class="badge badge-forced">ребёнок ★</span>';
  if (r.from <= 14) return '<span class="badge badge-child">ребёнок</span>';
  if (r.from <= 17) return '<span class="badge badge-teen">подросток</span>';
  return '<span class="badge badge-adult">взрослый</span>';
}
function cls(r) {
  if (r.forced || r.from <= 5)  return 'age-young';
  if (r.from <= 14) return 'age-child';
  if (r.from <= 17) return 'age-teen';
  if (r.from <= 40) return 'age-adult';
  return 'age-old';
}

function render(data) {
  const tbody = document.getElementById('tbody');
  const frag  = document.createDocumentFragment();
  data.forEach(r => {
    const isChecked = checked.has(r.id);
    const tr = document.createElement('tr');
    tr.id = 'row-' + r.id;
    tr.className = cls(r) + (isChecked ? ' row-checked' : '');
    const barW = Math.max(4, Math.round(r.from / 99 * 80));
    const short = r.url.replace('https://fsn1.your-objectstorage.com/artworks-assets/', '');

    // Checkbox
    const tdCb = document.createElement('td');
    tdCb.className = 'td-cb';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = isChecked;
    cb.addEventListener('change', () => toggleCheck(r.id, cb.checked));
    tdCb.appendChild(cb);

    // ID
    const td1 = document.createElement('td');
    const aId = document.createElement('a');
    aId.className   = 'ls-link';
    aId.href        = LS_BASE + '/projects/3/data?tab=65&task=' + r.id;
    aId.target      = '_blank';
    aId.rel         = 'noopener';
    aId.textContent = r.id;
    td1.appendChild(aId);

    // Age
    const td2 = document.createElement('td');
    td2.className = 'age-cell';
    td2.innerHTML = badge(r) + r.from + '\u2013' + r.to +
      '<span class="age-bar" style="width:' + barW + 'px"></span>';

    // Image
    const td3  = document.createElement('td');
    td3.className = 'url-cell';
    const aImg = document.createElement('a');
    aImg.className   = 'img-link';
    aImg.href        = r.url;
    aImg.target      = '_blank';
    aImg.rel         = 'noopener';
    aImg.textContent = short;
    aImg.addEventListener('mouseenter', e => {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => showTip(r.url, short, e.clientX, e.clientY), 120);
    });
    aImg.addEventListener('mouseleave', () => {
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(hideTip, 80);
    });
    td3.appendChild(aImg);

    tr.append(tdCb, td1, td2, td3);
    frag.appendChild(tr);
  });
  tbody.innerHTML = '';
  tbody.appendChild(frag);
  updateCount();
}

function updateCount() {
  const rows = document.querySelectorAll('#tbody tr');
  document.getElementById('count').textContent =
    rows.length + ' / ' + RAW.length + ' записей  |  отмечено: ' + checked.size;
}

    const id = parseInt(tr.id.replace('row-', ''));
    const cb = tr.querySelector('input[type=checkbox]');
    if (cb) { cb.checked = this.checked; toggleCheck(id, this.checked); }
  });
});

let sortMode = 'id';
function sortData(d, m) {
  if (m === 'id')       return [...d].sort((a,b) => a.id - b.id);
  if (m === 'age-asc')  return [...d].sort((a,b) => a.from - b.from || a.to - b.to);
  if (m === 'age-desc') return [...d].sort((a,b) => b.from - a.from || b.to - a.to);
  return d;
}
function applyFilters() {
  const age = document.getElementById('filter-age').value;
  const cbf = document.getElementById('filter-cb').value;
  const sid = document.getElementById('search-id').value.trim();
  let d = [...RAW];
  if (age === 'child') d = d.filter(r => isChild(r));
  if (age === 'teen')  d = d.filter(r => isTeen(r));
  if (age === 'adult') d = d.filter(r => isAdult(r));
  if (cbf === 'checked')   d = d.filter(r => checked.has(r.id));
  if (cbf === 'unchecked') d = d.filter(r => !checked.has(r.id));
  if (sid) d = d.filter(r => String(r.id).includes(sid));
  render(sortData(d, sortMode));
}
function sortBy(m) {
  sortMode = m;
  document.getElementById('sort-by').value = m;
  applyFilters();
}
document.getElementById('filter-age').addEventListener('change', applyFilters);
document.getElementById('filter-cb').addEventListener('change', applyFilters);
document.getElementById('search-id').addEventListener('input', applyFilters);
document.getElementById('sort-by').addEventListener('change', e => { sortMode = e.target.value; applyFilters(); });
document.getElementById('subtitle').textContent = ' — ' + RAW.length + ' изображений, view 65';
applyFilters();
</script>
</body>
